<!--
  colyseus.js se carga como script clásico (UMD), NO como módulo ES.
  El build ESM del paquete (build/esm/index.mjs) depende internamente de otros
  paquetes (@colyseus/schema, @colyseus/httpie, y hasta el paquete "ws" de Node)
  que el navegador no puede resolver sin un bundler, y eso rompe el script entero
  en silencio. Este build UMD (dist/colyseus.js) está pre-empaquetado y es
  autocontenido: expone todo en window.Colyseus. Va justo antes del script
  principal, para garantizar que window.Colyseus ya existe cuando este se ejecuta.
-->
<script src="https://unpkg.com/colyseus.js@0.16.22/dist/colyseus.js"></script>

<script type="module">
import * as THREE from 'three';
// colyseus.js se carga arriba como <script> clásico (UMD) -> window.Colyseus
const { Client, getStateCallbacks } = window.Colyseus;

/* =========================================================
   SHADOW — Prototipo técnico Fase 1
   Objetivo: validar cámara isométrica, movimiento, terreno,
   instancing y rendimiento en móvil. Sin backend, sin GLB.
   ========================================================= */

// ---------- Config ----------
const CHUNK_SIZE = 128;       // metros por chunk (referencia GDD)
const PLAYER_SPEED = 3.5;     // unidades/seg (ritmo de caminata; antes 9 se sentía como galope)
const CAMERA_DISTANCE = 18;
const CAMERA_HEIGHT = 16;

// URL del servidor de juego (Colyseus). Ya apunta al servidor desplegado en Render.
// En local (probando en el propio PC con el servidor corriendo) usa ws://localhost:2567
const SERVER_URL = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
  ? 'ws://localhost:2567'
  : 'wss://shadow-server-px6w.onrender.com';

// ---------- Escena base ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a2530);
scene.fog = new THREE.Fog(0x1a2530, 60, 140);

const camera = new THREE.OrthographicCamera(-16, 16, 9, -9, 0.1, 500);
// Encuadre isométrico clásico (~35.264°) rotado 45° en Y
camera.position.set(CAMERA_DISTANCE, CAMERA_HEIGHT, CAMERA_DISTANCE);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

function resize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const aspect = w / h;
  const viewSize = 9;
  camera.left = -viewSize * aspect;
  camera.right = viewSize * aspect;
  camera.top = viewSize;
  camera.bottom = -viewSize;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', resize);
resize();

// ---------- Luces ----------
const ambient = new THREE.AmbientLight(0x6b7d8f, 0.75);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xfff4e0, 1.3);
sun.position.set(30, 45, 15);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -40;
sun.shadow.camera.right = 40;
sun.shadow.camera.top = 40;
sun.shadow.camera.bottom = -40;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 120;
sun.shadow.bias = -0.0015;
scene.add(sun);

// ---------- Sistema de chunks ----------
// Cada chunk es una porción de CHUNK_SIZE x CHUNK_SIZE metros.
// Se genera de forma determinista a partir de (chunkX, chunkZ) + WORLD_SEED,
// así que el mismo chunk siempre produce el mismo contenido (sección 10 del GDD).
// El ChunkManager carga los chunks cercanos al jugador y descarga los lejanos.

const WORLD_SEED = 1337;
const LOAD_RADIUS = 1; // en chunks alrededor del jugador (radio 1 = grid 3x3)

// Geometrías y materiales compartidos (una sola vez, reutilizados por todos los chunks)
const groundGeoShared = new THREE.PlaneGeometry(CHUNK_SIZE, CHUNK_SIZE, 8, 8).rotateX(-Math.PI / 2);
const groundMatShared = new THREE.MeshStandardMaterial({ color: 0x3a5a3f, roughness: 1 });
const trunkGeo = new THREE.CylinderGeometry(0.25, 0.32, 1.6, 6);
const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5a3d2b, roughness: 0.9 });
const leafGeo = new THREE.ConeGeometry(1.3, 2.6, 7);
const leafMat = new THREE.MeshStandardMaterial({ color: 0x2f6b3a, roughness: 0.85 });
const rockGeo = new THREE.DodecahedronGeometry(0.9, 0);
const rockMat = new THREE.MeshStandardMaterial({ color: 0x6b6f75, roughness: 1, flatShading: true });

const dummy = new THREE.Object3D();

// Hash simple para combinar la semilla del mundo con coordenadas de chunk.
// Así cada chunk tiene contenido distinto pero reproducible.
function chunkSeed(cx, cz) {
  return (WORLD_SEED ^ (cx * 374761393) ^ (cz * 668265263)) >>> 0;
}

function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

class Chunk {
  constructor(cx, cz) {
    this.cx = cx;
    this.cz = cz;
    this.group = new THREE.Group();
    this.obstacles = []; // colisionadores en coordenadas de mundo (absolutas)

    const originX = cx * CHUNK_SIZE;
    const originZ = cz * CHUNK_SIZE;
    this.group.position.set(originX, 0, originZ);

    // Terreno
    const ground = new THREE.Mesh(groundGeoShared, groundMatShared);
    ground.receiveShadow = true;
    this.group.add(ground);

    // Borde del chunk (referencia visual de desarrollo)
    const edge = new THREE.LineSegments(
      new THREE.EdgesGeometry(new THREE.PlaneGeometry(CHUNK_SIZE, CHUNK_SIZE).rotateX(-Math.PI / 2)),
      new THREE.LineBasicMaterial({ color: 0x7fe0a0, transparent: true, opacity: 0.15 })
    );
    edge.position.y = 0.03;
    this.group.add(edge);

    // Generación procedural determinista de árboles y rocas
    const rng = mulberry32(chunkSeed(cx, cz));
    const treePositions = [];
    const rockPositions = [];

    for (let i = 0; i < 40; i++) {
      const x = (rng() - 0.5) * (CHUNK_SIZE - 10);
      const z = (rng() - 0.5) * (CHUNK_SIZE - 10);
      // Reservamos el centro del chunk (0,0) como zona de spawn despejada
      if (cx === 0 && cz === 0 && Math.hypot(x, z) < 6) continue;
      treePositions.push({ x, z, scale: 0.8 + rng() * 0.6, rot: rng() * Math.PI * 2 });
    }
    for (let i = 0; i < 22; i++) {
      const x = (rng() - 0.5) * (CHUNK_SIZE - 10);
      const z = (rng() - 0.5) * (CHUNK_SIZE - 10);
      if (cx === 0 && cz === 0 && Math.hypot(x, z) < 5) continue;
      rockPositions.push({ x, z, scale: 0.5 + rng() * 0.8, rot: rng() * Math.PI * 2 });
    }

    if (treePositions.length > 0) {
      const trunkMesh = new THREE.InstancedMesh(trunkGeo, trunkMat, treePositions.length);
      const leafMesh = new THREE.InstancedMesh(leafGeo, leafMat, treePositions.length);
      trunkMesh.castShadow = true;
      leafMesh.castShadow = true;

      treePositions.forEach((t, i) => {
        dummy.position.set(t.x, 0.8 * t.scale, t.z);
        dummy.rotation.set(0, t.rot, 0);
        dummy.scale.setScalar(t.scale);
        dummy.updateMatrix();
        trunkMesh.setMatrixAt(i, dummy.matrix);

        dummy.position.set(t.x, 2.1 * t.scale, t.z);
        dummy.updateMatrix();
        leafMesh.setMatrixAt(i, dummy.matrix);

        this.obstacles.push({ x: originX + t.x, z: originZ + t.z, r: 0.5 * t.scale });
      });
      trunkMesh.instanceMatrix.needsUpdate = true;
      leafMesh.instanceMatrix.needsUpdate = true;
      this.group.add(trunkMesh, leafMesh);
    }

    if (rockPositions.length > 0) {
      const rockMesh = new THREE.InstancedMesh(rockGeo, rockMat, rockPositions.length);
      rockMesh.castShadow = true;
      rockMesh.receiveShadow = true;

      rockPositions.forEach((r, i) => {
        dummy.position.set(r.x, 0.4 * r.scale, r.z);
        dummy.rotation.set(rng() * 0.3, r.rot, rng() * 0.3);
        dummy.scale.setScalar(r.scale);
        dummy.updateMatrix();
        rockMesh.setMatrixAt(i, dummy.matrix);

        this.obstacles.push({ x: originX + r.x, z: originZ + r.z, r: 0.7 * r.scale });
      });
      rockMesh.instanceMatrix.needsUpdate = true;
      this.group.add(rockMesh);
    }
  }

  dispose() {
    // InstancedMesh y PlaneGeometry compartidas no se destruyen (son reutilizadas),
    // solo se saca el grupo de la escena. Si un chunk usara geometría única,
    // aquí habría que llamar a geometry.dispose() / material.dispose().
  }
}

class ChunkManager {
  constructor(scene) {
    this.scene = scene;
    this.loaded = new Map(); // key "cx,cz" -> Chunk
  }

  key(cx, cz) { return `${cx},${cz}`; }

  update(playerX, playerZ) {
    const pcx = Math.floor((playerX + CHUNK_SIZE / 2) / CHUNK_SIZE);
    const pcz = Math.floor((playerZ + CHUNK_SIZE / 2) / CHUNK_SIZE);

    const needed = new Set();
    for (let dx = -LOAD_RADIUS; dx <= LOAD_RADIUS; dx++) {
      for (let dz = -LOAD_RADIUS; dz <= LOAD_RADIUS; dz++) {
        const cx = pcx + dx;
        const cz = pcz + dz;
        const k = this.key(cx, cz);
        needed.add(k);
        if (!this.loaded.has(k)) {
          const chunk = new Chunk(cx, cz);
          this.scene.add(chunk.group);
          this.loaded.set(k, chunk);
        }
      }
    }

    // Descargar chunks que ya no están en el radio
    for (const [k, chunk] of this.loaded) {
      if (!needed.has(k)) {
        this.scene.remove(chunk.group);
        chunk.dispose();
        this.loaded.delete(k);
      }
    }

    return { pcx, pcz };
  }

  getAllObstacles() {
    const all = [];
    for (const chunk of this.loaded.values()) all.push(...chunk.obstacles);
    return all;
  }
}

const chunkManager = new ChunkManager(scene);
chunkManager.update(0, 0); // carga inicial en el spawn

// ---------- Personaje (placeholder geométrico) ----------
const player = new THREE.Group();

const bodyGeo = new THREE.CapsuleGeometry(0.4, 0.9, 4, 8);
const bodyMat = new THREE.MeshStandardMaterial({ color: 0x7fe0a0, roughness: 0.6 });
const body = new THREE.Mesh(bodyGeo, bodyMat);
body.position.y = 0.85;
body.castShadow = true;
player.add(body);

// Indicador de dirección (para leer hacia dónde mira en cámara isométrica)
const facingGeo = new THREE.ConeGeometry(0.18, 0.4, 6);
const facingMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
const facing = new THREE.Mesh(facingGeo, facingMat);
facing.rotation.x = Math.PI / 2;
facing.position.set(0, 0.85, 0.55);
player.add(facing);

player.position.set(0, 0, 0);
scene.add(player);

const PLAYER_RADIUS = 0.45;

// ---------- Red: conexión con el servidor Colyseus ----------
// El servidor es la autoridad (docs/technical/Arquitectura_Inicial.md).
// Este cliente sigue moviendo al jugador local de forma inmediata (para que
// se sienta responsivo), pero además envía la intención de movimiento al
// servidor, y dibuja a los DEMÁS jugadores exactamente donde el servidor dice.

const netStatusEl = document.getElementById('netstatus');
function setNetStatus(state, label) {
  netStatusEl.className = state;
  netStatusEl.textContent = label;
}

function createRemotePlayerMesh() {
  const group = new THREE.Group();
  const remoteBody = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.4, 0.9, 4, 8),
    new THREE.MeshStandardMaterial({ color: 0x7fa8e0, roughness: 0.6 })
  );
  remoteBody.position.y = 0.85;
  remoteBody.castShadow = true;
  group.add(remoteBody);

  const remoteFacing = new THREE.Mesh(
    new THREE.ConeGeometry(0.18, 0.4, 6),
    new THREE.MeshStandardMaterial({ color: 0xffffff })
  );
  remoteFacing.rotation.x = Math.PI / 2;
  remoteFacing.position.set(0, 0.85, 0.55);
  group.add(remoteFacing);

  return group;
}

// Criatura: cápsula más baja y alargada (a lo "lobo") + dos "orejas" (conos) para
// distinguirla de un jugador de un vistazo, aún sin modelos GLB.
const creatureBodyMat = new THREE.MeshStandardMaterial({ color: 0x9c5a4a, roughness: 0.8 });
const creatureAlertMat = new THREE.MeshStandardMaterial({ color: 0xe0524a, roughness: 0.6, emissive: 0x3a0f0a, emissiveIntensity: 0.4 });

// Bolsa de loot: un saquito simple en el suelo, con un ligero balanceo para
// que se note como "objeto interactuable" sin necesitar un modelo GLB todavía.
const lootBagMat = new THREE.MeshStandardMaterial({ color: 0x6b4a2e, roughness: 0.9 });
function createLootBagMesh() {
  const group = new THREE.Group();
  const sack = new THREE.Mesh(new THREE.SphereGeometry(0.32, 8, 6), lootBagMat);
  sack.scale.set(1, 0.75, 1);
  sack.position.y = 0.28;
  sack.castShadow = true;
  group.add(sack);

  const tie = new THREE.Mesh(
    new THREE.TorusGeometry(0.1, 0.03, 6, 10),
    new THREE.MeshStandardMaterial({ color: 0x4a3320 })
  );
  tie.rotation.x = Math.PI / 2;
  tie.position.y = 0.5;
  group.add(tie);

  group.userData.sack = sack;
  return group;
}

function createCreatureMesh() {
  const group = new THREE.Group();

  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.35, 0.6, 4, 8), creatureBodyMat.clone());
  body.rotation.z = Math.PI / 2; // tumbada, como un cuerpo a cuatro patas visto de lado
  body.position.y = 0.4;
  body.castShadow = true;
  group.add(body);

  const earGeo = new THREE.ConeGeometry(0.1, 0.25, 5);
  const earMat = new THREE.MeshStandardMaterial({ color: 0x6b3a2e });
  const earL = new THREE.Mesh(earGeo, earMat);
  earL.position.set(-0.12, 0.75, 0.35);
  const earR = earL.clone();
  earR.position.x = 0.12;
  group.add(earL, earR);

  // Barra de vida simple sobre la criatura. La cámara isométrica tiene un ángulo
  // FIJO siempre (nunca orbita), así que basta con contrarrestar la rotación
  // propia de la criatura para que la barra "mire" siempre hacia la cámara.
  const billboard = new THREE.Group();
  const hpBarBg = new THREE.Mesh(
    new THREE.PlaneGeometry(0.9, 0.12),
    new THREE.MeshBasicMaterial({ color: 0x1a1a1a, transparent: true, opacity: 0.7 })
  );
  hpBarBg.position.set(0, 1.15, 0);
  const hpBarFg = new THREE.Mesh(
    new THREE.PlaneGeometry(0.86, 0.08),
    new THREE.MeshBasicMaterial({ color: 0xe0524a })
  );
  hpBarFg.position.set(0, 1.15, 0.001);
  billboard.add(hpBarBg, hpBarFg);
  group.add(billboard);

  // Anillo en el suelo que marca "esto es tu objetivo actual" — oculto por defecto,
  // se activa/desactiva en el loop de animación comparando con currentTargetId.
  const targetRing = new THREE.Mesh(
    new THREE.RingGeometry(0.55, 0.68, 24),
    new THREE.MeshBasicMaterial({ color: 0xff5544, side: THREE.DoubleSide, transparent: true, opacity: 0.9 })
  );
  targetRing.rotation.x = -Math.PI / 2;
  targetRing.position.y = 0.03;
  targetRing.visible = false;
  group.add(targetRing);

  group.userData.body = body;
  group.userData.billboard = billboard;
  group.userData.hpBarFg = hpBarFg;
  group.userData.hpBarBaseWidth = 0.86;
  group.userData.targetRing = targetRing;

  return group;
}

const ISO_BILLBOARD_ANGLE = Math.PI / 4; // ángulo fijo de la cámara isométrica (ver isoForward/isoRight)

const remotePlayers = new Map(); // sessionId -> { group, targetX, targetZ, targetRotY }
const creatures = new Map();     // creatureId -> { group, targetX, targetZ, targetRotY, aiState }
const lootBags = new Map();      // bagId -> { group, state }
let openLootBagId = null;        // bolsa actualmente mostrada en el panel, si hay alguna
let room = null;
let mySessionId = null;

// El servidor en Render (plan free) puede estar "dormido" y tardar bastante en
// despertar (cold start). Si intentamos unirnos a la sala directamente durante
// ese arranque, Colyseus puede destruir la sala antes de que la conexión real
// llegue a completarse. Por eso, primero hacemos una petición HTTP simple a
// /health y reintentamos hasta que responda, y SOLO ENTONCES nos unimos a la
// partida — así separamos "despertar el servidor" de "unirse a la partida".
async function wakeUpServer(maxAttempts = 8) {
  const httpBase = SERVER_URL.replace(/^ws/, 'http');
  for (let attempt = 1; attempt <= maxAttempts; attempt++) {
    setNetStatus('connecting', `despertando servidor… (${attempt}/${maxAttempts})`);
    try {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 8000);
      const res = await fetch(`${httpBase}/health`, { signal: controller.signal });
      clearTimeout(timeout);
      if (res.ok) return true;
    } catch (err) {
      // Timeout o servidor aún dormido: seguimos reintentando.
    }
    await new Promise(r => setTimeout(r, 1500));
  }
  return false;
}

// playerId: identificador estable para este navegador/dispositivo, usado para
// recuperar el progreso guardado en Supabase entre sesiones. No es un sistema
// de login real (eso vendrá más adelante) — simplemente evita perder el
// progreso al recargar la página en el mismo móvil.
function getOrCreatePlayerId() {
  const KEY = 'shadow_player_id';
  let id = localStorage.getItem(KEY);
  if (!id) {
    id = 'p_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
    localStorage.setItem(KEY, id);
  }
  return id;
}

// Limpia todas las entidades remotas dibujadas (jugadores, criaturas, bolsas)
// antes de volver a sincronizar tras una reconexión — evita duplicados si el
// estado se vuelve a decodificar entero desde cero.
function clearRemoteEntities() {
  for (const entry of remotePlayers.values()) scene.remove(entry.group);
  remotePlayers.clear();
  for (const entry of creatures.values()) scene.remove(entry.group);
  creatures.clear();
  for (const entry of lootBags.values()) scene.remove(entry.group);
  lootBags.clear();
  closeLootPanel();
}

// Conecta todos los listeners de sincronización de estado a una sala ya
// unida/reconectada. Se llama tanto en la conexión inicial como tras
// recuperar una sesión, para no duplicar esta lógica.
function attachRoomHandlers(room) {
  const $ = getStateCallbacks(room);

  $(room.state).players.onAdd((playerState, sessionId) => {
    if (sessionId === mySessionId) {
      // Este es mi propio jugador: no dibujamos un duplicado, pero sí nos
      // suscribimos a mi oro (esperar a onAdd evita leer el estado antes de
      // que haya llegado del servidor, que puede tardar un instante tras unirse).
      goldEl.textContent = playerState.gold;
      $(playerState).onChange(() => { goldEl.textContent = playerState.gold; });
      return;
    }
    const group = createRemotePlayerMesh();
    group.position.set(playerState.x, playerState.y, playerState.z);
    scene.add(group);
    const entry = { group, targetX: playerState.x, targetZ: playerState.z, targetRotY: playerState.rotationY };
    remotePlayers.set(sessionId, entry);

    $(playerState).onChange(() => {
      entry.targetX = playerState.x;
      entry.targetZ = playerState.z;
      entry.targetRotY = playerState.rotationY;
    });
  });

  $(room.state).players.onRemove((playerState, sessionId) => {
    const entry = remotePlayers.get(sessionId);
    if (entry) {
      scene.remove(entry.group);
      remotePlayers.delete(sessionId);
    }
  });

  // Criaturas: el servidor decide posición, rotación, vida y estado de IA.
  // El cliente solo dibuja e interpola — igual que con los jugadores remotos.
  $(room.state).creatures.onAdd((creatureState, creatureId) => {
    const group = createCreatureMesh();
    group.position.set(creatureState.x, creatureState.y, creatureState.z);
    group.userData.creatureId = creatureId; // para identificarla al hacer raycast de un toque
    scene.add(group);
    const entry = {
      group,
      targetX: creatureState.x,
      targetZ: creatureState.z,
      targetRotY: creatureState.rotationY,
      aiState: creatureState.aiState,
      lastHp: creatureState.hp,
    };
    creatures.set(creatureId, entry);
    updateCreatureVisuals(entry, creatureState);

    $(creatureState).onChange(() => {
      entry.targetX = creatureState.x;
      entry.targetZ = creatureState.z;
      entry.targetRotY = creatureState.rotationY;
      entry.aiState = creatureState.aiState;
      if (creatureState.hp < entry.lastHp) flashHit(entry); // bajó la vida: acaba de recibir un golpe
      entry.lastHp = creatureState.hp;
      updateCreatureVisuals(entry, creatureState);
    });
  });

  $(room.state).creatures.onRemove((creatureState, creatureId) => {
    const entry = creatures.get(creatureId);
    if (entry) {
      scene.remove(entry.group);
      creatures.delete(creatureId);
    }
  });

  // Bolsas de loot: aparecen al morir una criatura, desaparecen al vaciarse
  // (o cuando alguien se lleva el último objeto). El contenido en sí (oro,
  // futuros items) se lee directamente del estado sincronizado al abrir el panel.
  $(room.state).lootBags.onAdd((bagState, bagId) => {
    const group = createLootBagMesh();
    group.position.set(bagState.x, 0, bagState.z);
    group.userData.bagId = bagId;
    scene.add(group);
    lootBags.set(bagId, { group, state: bagState });

    // Si tenemos el panel de esta bolsa abierto y alguien coge algo (incluido
    // nosotros mismos), refrescamos la lista para que no se quede desactualizada.
    $(bagState).items.onAdd(() => { if (openLootBagId === bagId) renderLootPanel(); });
    $(bagState).items.onRemove(() => { if (openLootBagId === bagId) renderLootPanel(); });
  });

  $(room.state).lootBags.onRemove((bagState, bagId) => {
    const entry = lootBags.get(bagId);
    if (entry) {
      scene.remove(entry.group);
      lootBags.delete(bagId);
    }
    // Si la bolsa que teníamos abierta en el panel desaparece (se vació), cerramos el panel.
    if (openLootBagId === bagId) closeLootPanel();
  });
}

// Tras un corte inesperado, reintenta recuperar la MISMA sesión unas cuantas
// veces antes de rendirse y quedarse en modo local. Usa el mismo token que
// guardamos al conectar — el servidor mantiene la sesión viva unos segundos
// (ver RECONNECTION_GRACE_SECONDS en el servidor) esperando justo esto.
let reconnecting = false;
async function attemptAutoReconnect(maxAttempts = 5) {
  if (reconnecting) return; // evita intentos duplicados si el evento salta más de una vez
  reconnecting = true;

  const token = sessionStorage.getItem('shadow_reconnect_token');
  if (!token) { reconnecting = false; setNetStatus('offline', 'desconectado'); return; }

  for (let attempt = 1; attempt <= maxAttempts; attempt++) {
    setNetStatus('connecting', `reconectando… (${attempt}/${maxAttempts})`);
    try {
      const client = new Client(SERVER_URL);
      const newRoom = await client.reconnect(token);
      clearRemoteEntities(); // por si algo quedó a medias antes del corte
      room = newRoom;
      mySessionId = room.sessionId;
      sessionStorage.setItem('shadow_reconnect_token', room.reconnectionToken);
      attachRoomHandlers(room);
      room.onLeave((code) => {
        if (code === 1000) {
          setNetStatus('offline', 'desconectado');
          sessionStorage.removeItem('shadow_reconnect_token');
          return;
        }
        attemptAutoReconnect();
      });
      setNetStatus('connected', 'conectado');
      reconnecting = false;
      return;
    } catch (err) {
      console.warn(`[Shadow] Intento de reconexión ${attempt} fallido:`, err.message);
      await new Promise(r => setTimeout(r, 2000));
    }
  }

  console.warn('[Shadow] No se pudo recuperar la sesión tras varios intentos.');
  sessionStorage.removeItem('shadow_reconnect_token');
  setNetStatus('offline', 'sin servidor');
  reconnecting = false;
}

async function connectToServer() {
  setNetStatus('connecting', 'conectando…');

  const awake = await wakeUpServer();
  if (!awake) {
    console.warn('[Shadow] El servidor no respondió tras varios intentos, jugando en modo local.');
    setNetStatus('offline', 'sin servidor');
    return;
  }

  const client = new Client(SERVER_URL);
  const playerId = getOrCreatePlayerId();

  // Si veníamos de un corte de conexión (o de recargar la página en la misma
  // pestaña, ya que sessionStorage sobrevive a un refresh) e intentamos
  // recuperar la MISMA sesión antes de crear una nueva. Esto evita "fantasmas":
  // jugadores duplicados, o criaturas persiguiendo una posición ya abandonada.
  const savedToken = sessionStorage.getItem('shadow_reconnect_token');
  if (savedToken) {
    try {
      room = await client.reconnect(savedToken);
      console.log('[Shadow] Reconectado a la sesión anterior');
    } catch (err) {
      console.warn('[Shadow] No se pudo reconectar con el token guardado, uniendo de nuevo:', err.message);
      sessionStorage.removeItem('shadow_reconnect_token');
      room = null;
    }
  }

  try {
    if (!room) {
      room = await client.joinOrCreate('shadow_room', { name: 'Jugador', playerId });
    }
    mySessionId = room.sessionId;
    sessionStorage.setItem('shadow_reconnect_token', room.reconnectionToken);
    setNetStatus('connected', 'conectado');

    attachRoomHandlers(room);

    room.onLeave((code) => {
      // Código 1000 = cierre normal/voluntario. Cualquier otro código es un
      // corte inesperado (red móvil, cambio de wifi a datos, backgrounding del
      // navegador, etc.) — ahí vale la pena intentar recuperar la sesión sola,
      // sin que el jugador tenga que hacer nada.
      if (code === 1000) {
        setNetStatus('offline', 'desconectado');
        sessionStorage.removeItem('shadow_reconnect_token');
        return;
      }
      attemptAutoReconnect();
    });

  } catch (err) {
    console.warn('[Shadow] No se pudo conectar al servidor, jugando en modo local:', err.message);
    setNetStatus('offline', 'sin servidor');
  }
}

// Actualiza color (alerta si persigue) y barra de vida de una criatura.
// Separado del onChange para poder llamarlo también al crearla (estado inicial).
function updateCreatureVisuals(entry, creatureState) {
  const body = entry.group.userData.body;
  body.material = creatureState.aiState === 'combat' ? creatureAlertMat : creatureBodyMat;

  const hpRatio = Math.max(0, creatureState.hp / creatureState.maxHp);
  const hpBar = entry.group.userData.hpBarFg;
  hpBar.scale.x = hpRatio;
  hpBar.position.x = -(entry.group.userData.hpBarBaseWidth * (1 - hpRatio)) / 2;

  entry.group.visible = creatureState.aiState !== 'dead';
}

// Pequeño "golpe" visual (escala + destello blanco) al recibir daño, para que
// un ataque se sienta aunque el jugador no esté mirando la barra de vida.
function flashHit(entry) {
  entry.hitFlashTimer = 0.18; // segundos que dura el efecto, consumido en el loop de animación
}

connectToServer();

// Limitamos la frecuencia de envío de input para no saturar el servidor
// (el servidor igualmente simula a su propio ritmo, esto es solo la frecuencia de aviso).
let lastInputSent = { x: 0, z: 0 };
let netSendTimer = 0;
const NET_SEND_INTERVAL = 0.05; // 20 veces/seg

function sendInputToServer(inputX, inputZ, dt) {
  if (!room) return;
  netSendTimer += dt;
  if (netSendTimer < NET_SEND_INTERVAL) return;
  netSendTimer = 0;

  if (inputX !== lastInputSent.x || inputZ !== lastInputSent.z) {
    room.send('move', { dx: inputX, dz: inputZ });
    lastInputSent = { x: inputX, z: inputZ };
  }
}


const keys = { forward: false, back: false, left: false, right: false };
const keyMap = {
  KeyW: 'forward', ArrowUp: 'forward',
  KeyS: 'back', ArrowDown: 'back',
  KeyA: 'left', ArrowLeft: 'left',
  KeyD: 'right', ArrowRight: 'right',
};
window.addEventListener('keydown', e => { if (keyMap[e.code]) keys[keyMap[e.code]] = true; });
window.addEventListener('keyup', e => { if (keyMap[e.code]) keys[keyMap[e.code]] = false; });

// ---------- Input: joystick táctil ----------
const joyZone = document.getElementById('joystick-zone');
const joyBase = document.getElementById('joystick-base');
const joyThumb = document.getElementById('joystick-thumb');

let joyActive = false;
let joyOrigin = { x: 0, y: 0 };
let joyVector = { x: 0, y: 0 }; // -1..1
const JOY_RADIUS = 55;

function joyStart(clientX, clientY) {
  joyActive = true;
  joyOrigin = { x: clientX, y: clientY };
  joyBase.style.display = 'block';
  joyThumb.style.display = 'block';
  joyBase.style.left = (clientX - 55) + 'px';
  joyBase.style.top = (clientY - 55) + 'px';
  joyThumb.style.left = clientX + 'px';
  joyThumb.style.top = clientY + 'px';
}

function joyMove(clientX, clientY) {
  if (!joyActive) return;
  let dx = clientX - joyOrigin.x;
  let dy = clientY - joyOrigin.y;
  const dist = Math.hypot(dx, dy);
  if (dist > JOY_RADIUS) {
    dx = (dx / dist) * JOY_RADIUS;
    dy = (dy / dist) * JOY_RADIUS;
  }
  joyThumb.style.left = (joyOrigin.x + dx) + 'px';
  joyThumb.style.top = (joyOrigin.y + dy) + 'px';
  joyVector.x = dx / JOY_RADIUS;
  joyVector.y = dy / JOY_RADIUS;
}

function joyEnd() {
  joyActive = false;
  joyVector = { x: 0, y: 0 };
  joyBase.style.display = 'none';
  joyThumb.style.display = 'none';
}

joyZone.addEventListener('touchstart', e => {
  const t = e.changedTouches[0];
  joyStart(t.clientX, t.clientY);
  e.preventDefault();
}, { passive: false });

joyZone.addEventListener('touchmove', e => {
  const t = e.changedTouches[0];
  joyMove(t.clientX, t.clientY);
  e.preventDefault();
}, { passive: false });

joyZone.addEventListener('touchend', e => { joyEnd(); e.preventDefault(); }, { passive: false });
joyZone.addEventListener('touchcancel', e => { joyEnd(); e.preventDefault(); }, { passive: false });

// Soporte ratón también en la zona (útil para probar en desktop sin teclado)
joyZone.addEventListener('mousedown', e => joyStart(e.clientX, e.clientY));
window.addEventListener('mousemove', e => { if (joyActive) joyMove(e.clientX, e.clientY); });
window.addEventListener('mouseup', () => joyEnd());

// ---------- Modo guerra + selección de objetivo ----------
// El botón activa/desactiva el modo guerra (el servidor es quien decide si
// realmente se puede golpear: rango, cooldown, etc. — esto solo pide el estado).
// Con el modo activo, tocar sobre una criatura en pantalla la marca como objetivo;
// si además estás a rango cuerpo a cuerpo, el servidor golpea solo automáticamente.
let warModeActive = false;
let currentTargetId = '';

const warModeBtn = document.getElementById('war-mode-btn');
const raycaster = new THREE.Raycaster();

function setWarMode(active) {
  warModeActive = active;
  warModeBtn.classList.toggle('active', warModeActive);
  if (room) room.send('setWarMode', { active: warModeActive });
  if (!warModeActive) {
    currentTargetId = '';
  }
}

warModeBtn.addEventListener('click', () => setWarMode(!warModeActive));

function handleTapForTargeting(clientX, clientY) {
  if (!room) return;

  const ndc = new THREE.Vector2(
    (clientX / window.innerWidth) * 2 - 1,
    -(clientY / window.innerHeight) * 2 + 1
  );
  raycaster.setFromCamera(ndc, camera);

  // Primero comprobamos bolsas de loot — se pueden abrir siempre, sin necesidad
  // de estar en modo guerra (recoger botín es una acción aparte del combate).
  const bagSacks = [];
  for (const entry of lootBags.values()) bagSacks.push(entry.group.userData.sack);
  const bagHits = raycaster.intersectObjects(bagSacks, false);
  if (bagHits.length > 0) {
    const bagId = bagHits[0].object.parent.userData.bagId;
    openLootPanel(bagId);
    return;
  }

  // Si no tocamos una bolsa, y estamos en modo guerra, comprobamos criaturas para targeting.
  if (!warModeActive) return;

  const creatureBodies = [];
  for (const entry of creatures.values()) {
    if (entry.aiState === 'dead') continue;
    creatureBodies.push(entry.group.userData.body);
  }

  const hits = raycaster.intersectObjects(creatureBodies, false);
  if (hits.length === 0) return; // toque en el suelo o el vacío: no cambia nada

  const hitGroup = hits[0].object.parent; // el body es hijo del group de la criatura
  const creatureId = hitGroup.userData.creatureId;
  if (!creatureId) return;

  currentTargetId = creatureId;
  room.send('setTarget', { targetId: creatureId });
}

// ---------- Panel de saqueo ----------
const lootPanelEl = document.getElementById('loot-panel');
const lootItemsEl = document.getElementById('loot-items');
document.getElementById('loot-close-btn').addEventListener('click', closeLootPanel);

function openLootPanel(bagId) {
  openLootBagId = bagId;
  renderLootPanel();
  lootPanelEl.classList.add('visible');
}

function closeLootPanel() {
  openLootBagId = null;
  lootPanelEl.classList.remove('visible');
}

// Se re-renderiza cada vez que cambia el estado de la bolsa abierta (alguien
// coge algo, incluido nosotros mismos), para que el panel refleje lo real.
function renderLootPanel() {
  if (!openLootBagId) return;
  const entry = lootBags.get(openLootBagId);
  if (!entry) { closeLootPanel(); return; }

  const items = [...entry.state.items.entries()];
  if (items.length === 0) {
    lootItemsEl.innerHTML = '<div class="loot-empty">La bolsa está vacía</div>';
    return;
  }

  lootItemsEl.innerHTML = '';
  for (const [itemId, item] of items) {
    const row = document.createElement('div');
    row.className = 'loot-item';
    const label = item.kind === 'gold' ? `🪙 ${item.amount} de oro` : `${item.kind} x${item.amount}`;
    row.innerHTML = `<span>${label}</span><button>Coger</button>`;
    row.querySelector('button').addEventListener('click', () => {
      room.send('takeLootItem', { bagId: openLootBagId, itemId });
    });
    lootItemsEl.appendChild(row);
  }
}

// Escuchamos toques en el propio canvas (no en la zona del joystick, que ya
// captura sus propios toques por estar encima en esa esquina).
renderer.domElement.addEventListener('pointerdown', e => {
  handleTapForTargeting(e.clientX, e.clientY);
});

// ---------- Cámara: offset fijo isométrico que sigue al jugador ----------
const cameraOffset = new THREE.Vector3(CAMERA_DISTANCE, CAMERA_HEIGHT, CAMERA_DISTANCE);

// Direcciones de movimiento alineadas con el ángulo de cámara isométrico,
// para que "arriba" en pantalla se sienta como "alejarse de cámara".
const isoForward = new THREE.Vector3(-1, 0, -1).normalize();
const isoRight = new THREE.Vector3(1, 0, -1).normalize();

// ---------- Loop ----------
const clock = new THREE.Clock();
let fpsAccum = 0, fpsFrames = 0, fpsTimer = 0;
const fpsEl = document.getElementById('fps');
const chunkEl = document.getElementById('chunkinfo');
const aiDebugEl = document.getElementById('aidebug');
const combatWarningEl = document.getElementById('combat-warning');
const goldEl = document.getElementById('gold');
const COMBAT_WARNING_RADIUS = 5; // si una criatura en combate está a menos de esto de MI jugador, avisar

function resolveCollisions(pos, obstacles) {
  for (const o of obstacles) {
    const dx = pos.x - o.x;
    const dz = pos.z - o.z;
    const dist = Math.hypot(dx, dz);
    const minDist = o.r + PLAYER_RADIUS;
    if (dist < minDist && dist > 0.0001) {
      const push = (minDist - dist);
      pos.x += (dx / dist) * push;
      pos.z += (dz / dist) * push;
    }
  }
  // Sin límite de mundo: el terreno se extiende mientras haya chunks generados alrededor.
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05); // clamp para evitar saltos si hay lag

  // Entrada combinada: teclado + joystick
  let inputX = 0, inputZ = 0;
  if (keys.forward) inputZ -= 1;
  if (keys.back) inputZ += 1;
  if (keys.left) inputX -= 1;
  if (keys.right) inputX += 1;

  if (joyActive) {
    inputX += joyVector.x;
    inputZ += joyVector.y;
  }

  const inputLen = Math.hypot(inputX, inputZ);
  if (inputLen > 0.001) {
    const normX = inputX / Math.max(inputLen, 1);
    const normZ = inputZ / Math.max(inputLen, 1);

    const move = new THREE.Vector3()
      .addScaledVector(isoForward, -normZ)
      .addScaledVector(isoRight, normX);

    if (move.lengthSq() > 0.0001) {
      move.normalize().multiplyScalar(PLAYER_SPEED * dt * Math.min(inputLen, 1));
      const nextPos = player.position.clone().add(move);
      resolveCollisions(nextPos, chunkManager.getAllObstacles());
      player.position.copy(nextPos);

      const targetAngle = Math.atan2(move.x, move.z);
      player.rotation.y = lerpAngle(player.rotation.y, targetAngle, 0.2);
    }
  }

  // Avisar al servidor de la intención de movimiento (throttle interno).
  // El servidor decide la posición autoritativa; esto es solo la notificación.
  sendInputToServer(inputX, inputZ, dt);

  // Interpolar jugadores remotos hacia la última posición conocida del servidor,
  // para que el movimiento se vea suave aunque los paquetes lleguen a ~20/seg.
  for (const entry of remotePlayers.values()) {
    entry.group.position.x += (entry.targetX - entry.group.position.x) * Math.min(1, dt * 10);
    entry.group.position.z += (entry.targetZ - entry.group.position.z) * Math.min(1, dt * 10);
    entry.group.rotation.y = lerpAngle(entry.group.rotation.y, entry.targetRotY, 0.2);
  }

  // Igual para criaturas: siguen siendo 100% decisión del servidor, aquí solo suavizamos.
  for (const entry of creatures.values()) {
    entry.group.position.x += (entry.targetX - entry.group.position.x) * Math.min(1, dt * 10);
    entry.group.position.z += (entry.targetZ - entry.group.position.z) * Math.min(1, dt * 10);
    entry.group.rotation.y = lerpAngle(entry.group.rotation.y, entry.targetRotY, 0.15);
    entry.group.userData.billboard.rotation.y = ISO_BILLBOARD_ANGLE - entry.group.rotation.y;

    // Destello de golpe: un pequeño "punch" de escala que decae rápido
    if (entry.hitFlashTimer > 0) {
      entry.hitFlashTimer = Math.max(0, entry.hitFlashTimer - dt);
      const punch = 1 + (entry.hitFlashTimer / 0.18) * 0.35;
      entry.group.userData.body.scale.setScalar(punch);
    } else if (entry.group.userData.body.scale.x !== 1) {
      entry.group.userData.body.scale.setScalar(1);
    }

    // Anillo de objetivo: visible solo en la criatura que tengo marcada
    entry.group.userData.targetRing.visible = (entry.group.userData.creatureId === currentTargetId);
  }

  // Bolsas de loot: no se mueven (el servidor no las reposiciona), pero un
  // pequeño balanceo ayuda a que se noten como "objeto interactuable" en el suelo.
  for (const entry of lootBags.values()) {
    entry.group.userData.sack.position.y = 0.28 + Math.sin(performance.now() * 0.002) * 0.03;
    entry.group.rotation.y += dt * 0.4;
  }

  // Cargar/descargar chunks según posición del jugador
  const { pcx, pcz } = chunkManager.update(player.position.x, player.position.z);

  camera.position.copy(player.position).add(cameraOffset);
  camera.lookAt(player.position.x, player.position.y + 1, player.position.z);

  renderer.render(scene, camera);

  // FPS + info de chunk
  fpsFrames++;
  fpsTimer += dt;
  if (fpsTimer >= 0.5) {
    fpsEl.textContent = Math.round(fpsFrames / fpsTimer);
    fpsFrames = 0;
    fpsTimer = 0;
  }
  chunkEl.textContent = `${pcx},${pcz} (${chunkManager.loaded.size} activos)`;

  // Contador de depuración de IA: cuántas criaturas hay en cada estado.
  // Útil para confirmar que el aggro funciona sin depender solo del color visual.
  let patrolCount = 0, combatCount = 0, returningCount = 0, deadCount = 0;
  let threatNearby = false;
  for (const entry of creatures.values()) {
    if (entry.aiState === 'combat') {
      combatCount++;
      const dist = Math.hypot(entry.group.position.x - player.position.x, entry.group.position.z - player.position.z);
      if (dist <= COMBAT_WARNING_RADIUS) threatNearby = true;
    }
    else if (entry.aiState === 'returning') returningCount++;
    else if (entry.aiState === 'dead') deadCount++;
    else patrolCount++;
  }
  aiDebugEl.textContent = `${patrolCount} patrulla / ${combatCount} combate / ${returningCount} volviendo / ${deadCount} muertas`;
  combatWarningEl.classList.toggle('visible', threatNearby);
}

function lerpAngle(a, b, t) {
  let diff = ((b - a + Math.PI) % (Math.PI * 2)) - Math.PI;
  if (diff < -Math.PI) diff += Math.PI * 2;
  return a + diff * t;
}

animate();
</script>
