<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Shadow — Prototipo Fase 1</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0a0f14;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    touch-action: none;
    overscroll-behavior: none;
  }
  canvas { display: block; touch-action: none; }

  #hud {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: env(safe-area-inset-top, 10px) 12px 0 12px;
    pointer-events: none;
    z-index: 10;
  }

  #stats {
    background: rgba(10, 15, 20, 0.55);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 6px 10px;
    color: #7fe0a0;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    line-height: 1.5;
    margin-top: 8px;
  }

  #title {
    background: rgba(10, 15, 20, 0.55);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 6px 12px;
    color: #e8e6df;
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-top: 8px;
  }
  #title span { color: #7fe0a0; }

  /* Joystick virtual */
  #joystick-zone {
    position: fixed;
    left: 0; bottom: 0;
    width: 45%; height: 45%;
    z-index: 20;
    touch-action: none;
  }
  #joystick-base {
    position: fixed;
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    border: 2px solid rgba(255,255,255,0.15);
    display: none;
    pointer-events: none;
    z-index: 21;
  }
  #joystick-thumb {
    position: fixed;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: rgba(127, 224, 160, 0.35);
    border: 2px solid rgba(127, 224, 160, 0.8);
    display: none;
    pointer-events: none;
    z-index: 22;
    transform: translate(-50%, -50%);
  }

  #hint {
    position: fixed;
    bottom: env(safe-area-inset-bottom, 14px);
    right: 14px;
    color: rgba(255,255,255,0.35);
    font-size: 11px;
    text-align: right;
    z-index: 10;
    pointer-events: none;
    line-height: 1.4;
  }

  @media (min-width: 768px) {
    #joystick-zone { display: none; }
  }
</style>
</head>
<body>

<div id="hud">
  <div id="title">Shadow <span>· prototipo</span></div>
  <div id="stats">FPS: <span id="fps">--</span><br>Chunk: <span id="chunkinfo">0,0</span></div>
</div>

<div id="hint">WASD / flechas para moverte<br>Arrastra en pantalla (móvil)</div>

<div id="joystick-zone"></div>
<div id="joystick-base"></div>
<div id="joystick-thumb"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

/* =========================================================
   SHADOW — Prototipo técnico Fase 1
   Objetivo: validar cámara isométrica, movimiento, terreno,
   instancing y rendimiento en móvil. Sin backend, sin GLB.
   ========================================================= */

// ---------- Config ----------
const CHUNK_SIZE = 128;       // metros por chunk (referencia GDD)
const PLAYER_SPEED = 3.5;     // unidades/seg (ritmo de caminata; antes 9 se sentía como galope)
const CAMERA_DISTANCE = 18;
const CAMERA_HEIGHT = 16;

// ---------- Escena base ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a2530);
scene.fog = new THREE.Fog(0x1a2530, 60, 140);

const camera = new THREE.OrthographicCamera(-16, 16, 9, -9, 0.1, 500);
// Encuadre isométrico clásico (~35.264°) rotado 45° en Y
camera.position.set(CAMERA_DISTANCE, CAMERA_HEIGHT, CAMERA_DISTANCE);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

function resize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const aspect = w / h;
  const viewSize = 9;
  camera.left = -viewSize * aspect;
  camera.right = viewSize * aspect;
  camera.top = viewSize;
  camera.bottom = -viewSize;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', resize);
resize();

// ---------- Luces ----------
const ambient = new THREE.AmbientLight(0x6b7d8f, 0.75);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xfff4e0, 1.3);
sun.position.set(30, 45, 15);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -40;
sun.shadow.camera.right = 40;
sun.shadow.camera.top = 40;
sun.shadow.camera.bottom = -40;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 120;
sun.shadow.bias = -0.0015;
scene.add(sun);

// ---------- Sistema de chunks ----------
// Cada chunk es una porción de CHUNK_SIZE x CHUNK_SIZE metros.
// Se genera de forma determinista a partir de (chunkX, chunkZ) + WORLD_SEED,
// así que el mismo chunk siempre produce el mismo contenido (sección 10 del GDD).
// El ChunkManager carga los chunks cercanos al jugador y descarga los lejanos.

const WORLD_SEED = 1337;
const LOAD_RADIUS = 1; // en chunks alrededor del jugador (radio 1 = grid 3x3)

// Geometrías y materiales compartidos (una sola vez, reutilizados por todos los chunks)
const groundGeoShared = new THREE.PlaneGeometry(CHUNK_SIZE, CHUNK_SIZE, 8, 8).rotateX(-Math.PI / 2);
const groundMatShared = new THREE.MeshStandardMaterial({ color: 0x3a5a3f, roughness: 1 });
const trunkGeo = new THREE.CylinderGeometry(0.25, 0.32, 1.6, 6);
const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5a3d2b, roughness: 0.9 });
const leafGeo = new THREE.ConeGeometry(1.3, 2.6, 7);
const leafMat = new THREE.MeshStandardMaterial({ color: 0x2f6b3a, roughness: 0.85 });
const rockGeo = new THREE.DodecahedronGeometry(0.9, 0);
const rockMat = new THREE.MeshStandardMaterial({ color: 0x6b6f75, roughness: 1, flatShading: true });

const dummy = new THREE.Object3D();

// Hash simple para combinar la semilla del mundo con coordenadas de chunk.
// Así cada chunk tiene contenido distinto pero reproducible.
function chunkSeed(cx, cz) {
  return (WORLD_SEED ^ (cx * 374761393) ^ (cz * 668265263)) >>> 0;
}

function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

class Chunk {
  constructor(cx, cz) {
    this.cx = cx;
    this.cz = cz;
    this.group = new THREE.Group();
    this.obstacles = []; // colisionadores en coordenadas de mundo (absolutas)

    const originX = cx * CHUNK_SIZE;
    const originZ = cz * CHUNK_SIZE;
    this.group.position.set(originX, 0, originZ);

    // Terreno
    const ground = new THREE.Mesh(groundGeoShared, groundMatShared);
    ground.receiveShadow = true;
    this.group.add(ground);

    // Borde del chunk (referencia visual de desarrollo)
    const edge = new THREE.LineSegments(
      new THREE.EdgesGeometry(new THREE.PlaneGeometry(CHUNK_SIZE, CHUNK_SIZE).rotateX(-Math.PI / 2)),
      new THREE.LineBasicMaterial({ color: 0x7fe0a0, transparent: true, opacity: 0.15 })
    );
    edge.position.y = 0.03;
    this.group.add(edge);

    // Generación procedural determinista de árboles y rocas
    const rng = mulberry32(chunkSeed(cx, cz));
    const treePositions = [];
    const rockPositions = [];

    for (let i = 0; i < 40; i++) {
      const x = (rng() - 0.5) * (CHUNK_SIZE - 10);
      const z = (rng() - 0.5) * (CHUNK_SIZE - 10);
      // Reservamos el centro del chunk (0,0) como zona de spawn despejada
      if (cx === 0 && cz === 0 && Math.hypot(x, z) < 6) continue;
      treePositions.push({ x, z, scale: 0.8 + rng() * 0.6, rot: rng() * Math.PI * 2 });
    }
    for (let i = 0; i < 22; i++) {
      const x = (rng() - 0.5) * (CHUNK_SIZE - 10);
      const z = (rng() - 0.5) * (CHUNK_SIZE - 10);
      if (cx === 0 && cz === 0 && Math.hypot(x, z) < 5) continue;
      rockPositions.push({ x, z, scale: 0.5 + rng() * 0.8, rot: rng() * Math.PI * 2 });
    }

    if (treePositions.length > 0) {
      const trunkMesh = new THREE.InstancedMesh(trunkGeo, trunkMat, treePositions.length);
      const leafMesh = new THREE.InstancedMesh(leafGeo, leafMat, treePositions.length);
      trunkMesh.castShadow = true;
      leafMesh.castShadow = true;

      treePositions.forEach((t, i) => {
        dummy.position.set(t.x, 0.8 * t.scale, t.z);
        dummy.rotation.set(0, t.rot, 0);
        dummy.scale.setScalar(t.scale);
        dummy.updateMatrix();
        trunkMesh.setMatrixAt(i, dummy.matrix);

        dummy.position.set(t.x, 2.1 * t.scale, t.z);
        dummy.updateMatrix();
        leafMesh.setMatrixAt(i, dummy.matrix);

        this.obstacles.push({ x: originX + t.x, z: originZ + t.z, r: 0.5 * t.scale });
      });
      trunkMesh.instanceMatrix.needsUpdate = true;
      leafMesh.instanceMatrix.needsUpdate = true;
      this.group.add(trunkMesh, leafMesh);
    }

    if (rockPositions.length > 0) {
      const rockMesh = new THREE.InstancedMesh(rockGeo, rockMat, rockPositions.length);
      rockMesh.castShadow = true;
      rockMesh.receiveShadow = true;

      rockPositions.forEach((r, i) => {
        dummy.position.set(r.x, 0.4 * r.scale, r.z);
        dummy.rotation.set(rng() * 0.3, r.rot, rng() * 0.3);
        dummy.scale.setScalar(r.scale);
        dummy.updateMatrix();
        rockMesh.setMatrixAt(i, dummy.matrix);

        this.obstacles.push({ x: originX + r.x, z: originZ + r.z, r: 0.7 * r.scale });
      });
      rockMesh.instanceMatrix.needsUpdate = true;
      this.group.add(rockMesh);
    }
  }

  dispose() {
    // InstancedMesh y PlaneGeometry compartidas no se destruyen (son reutilizadas),
    // solo se saca el grupo de la escena. Si un chunk usara geometría única,
    // aquí habría que llamar a geometry.dispose() / material.dispose().
  }
}

class ChunkManager {
  constructor(scene) {
    this.scene = scene;
    this.loaded = new Map(); // key "cx,cz" -> Chunk
  }

  key(cx, cz) { return `${cx},${cz}`; }

  update(playerX, playerZ) {
    const pcx = Math.floor((playerX + CHUNK_SIZE / 2) / CHUNK_SIZE);
    const pcz = Math.floor((playerZ + CHUNK_SIZE / 2) / CHUNK_SIZE);

    const needed = new Set();
    for (let dx = -LOAD_RADIUS; dx <= LOAD_RADIUS; dx++) {
      for (let dz = -LOAD_RADIUS; dz <= LOAD_RADIUS; dz++) {
        const cx = pcx + dx;
        const cz = pcz + dz;
        const k = this.key(cx, cz);
        needed.add(k);
        if (!this.loaded.has(k)) {
          const chunk = new Chunk(cx, cz);
          this.scene.add(chunk.group);
          this.loaded.set(k, chunk);
        }
      }
    }

    // Descargar chunks que ya no están en el radio
    for (const [k, chunk] of this.loaded) {
      if (!needed.has(k)) {
        this.scene.remove(chunk.group);
        chunk.dispose();
        this.loaded.delete(k);
      }
    }

    return { pcx, pcz };
  }

  getAllObstacles() {
    const all = [];
    for (const chunk of this.loaded.values()) all.push(...chunk.obstacles);
    return all;
  }
}

const chunkManager = new ChunkManager(scene);
chunkManager.update(0, 0); // carga inicial en el spawn

// ---------- Personaje (placeholder geométrico) ----------
const player = new THREE.Group();

const bodyGeo = new THREE.CapsuleGeometry(0.4, 0.9, 4, 8);
const bodyMat = new THREE.MeshStandardMaterial({ color: 0x7fe0a0, roughness: 0.6 });
const body = new THREE.Mesh(bodyGeo, bodyMat);
body.position.y = 0.85;
body.castShadow = true;
player.add(body);

// Indicador de dirección (para leer hacia dónde mira en cámara isométrica)
const facingGeo = new THREE.ConeGeometry(0.18, 0.4, 6);
const facingMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
const facing = new THREE.Mesh(facingGeo, facingMat);
facing.rotation.x = Math.PI / 2;
facing.position.set(0, 0.85, 0.55);
player.add(facing);

player.position.set(0, 0, 0);
scene.add(player);

const PLAYER_RADIUS = 0.45;

// ---------- Input: teclado ----------
const keys = { forward: false, back: false, left: false, right: false };
const keyMap = {
  KeyW: 'forward', ArrowUp: 'forward',
  KeyS: 'back', ArrowDown: 'back',
  KeyA: 'left', ArrowLeft: 'left',
  KeyD: 'right', ArrowRight: 'right',
};
window.addEventListener('keydown', e => { if (keyMap[e.code]) keys[keyMap[e.code]] = true; });
window.addEventListener('keyup', e => { if (keyMap[e.code]) keys[keyMap[e.code]] = false; });

// ---------- Input: joystick táctil ----------
const joyZone = document.getElementById('joystick-zone');
const joyBase = document.getElementById('joystick-base');
const joyThumb = document.getElementById('joystick-thumb');

let joyActive = false;
let joyOrigin = { x: 0, y: 0 };
let joyVector = { x: 0, y: 0 }; // -1..1
const JOY_RADIUS = 55;

function joyStart(clientX, clientY) {
  joyActive = true;
  joyOrigin = { x: clientX, y: clientY };
  joyBase.style.display = 'block';
  joyThumb.style.display = 'block';
  joyBase.style.left = (clientX - 55) + 'px';
  joyBase.style.top = (clientY - 55) + 'px';
  joyThumb.style.left = clientX + 'px';
  joyThumb.style.top = clientY + 'px';
}

function joyMove(clientX, clientY) {
  if (!joyActive) return;
  let dx = clientX - joyOrigin.x;
  let dy = clientY - joyOrigin.y;
  const dist = Math.hypot(dx, dy);
  if (dist > JOY_RADIUS) {
    dx = (dx / dist) * JOY_RADIUS;
    dy = (dy / dist) * JOY_RADIUS;
  }
  joyThumb.style.left = (joyOrigin.x + dx) + 'px';
  joyThumb.style.top = (joyOrigin.y + dy) + 'px';
  joyVector.x = dx / JOY_RADIUS;
  joyVector.y = dy / JOY_RADIUS;
}

function joyEnd() {
  joyActive = false;
  joyVector = { x: 0, y: 0 };
  joyBase.style.display = 'none';
  joyThumb.style.display = 'none';
}

joyZone.addEventListener('touchstart', e => {
  const t = e.changedTouches[0];
  joyStart(t.clientX, t.clientY);
  e.preventDefault();
}, { passive: false });

joyZone.addEventListener('touchmove', e => {
  const t = e.changedTouches[0];
  joyMove(t.clientX, t.clientY);
  e.preventDefault();
}, { passive: false });

joyZone.addEventListener('touchend', e => { joyEnd(); e.preventDefault(); }, { passive: false });
joyZone.addEventListener('touchcancel', e => { joyEnd(); e.preventDefault(); }, { passive: false });

// Soporte ratón también en la zona (útil para probar en desktop sin teclado)
joyZone.addEventListener('mousedown', e => joyStart(e.clientX, e.clientY));
window.addEventListener('mousemove', e => { if (joyActive) joyMove(e.clientX, e.clientY); });
window.addEventListener('mouseup', () => joyEnd());

// ---------- Cámara: offset fijo isométrico que sigue al jugador ----------
const cameraOffset = new THREE.Vector3(CAMERA_DISTANCE, CAMERA_HEIGHT, CAMERA_DISTANCE);

// Direcciones de movimiento alineadas con el ángulo de cámara isométrico,
// para que "arriba" en pantalla se sienta como "alejarse de cámara".
const isoForward = new THREE.Vector3(-1, 0, -1).normalize();
const isoRight = new THREE.Vector3(1, 0, -1).normalize();

// ---------- Loop ----------
const clock = new THREE.Clock();
let fpsAccum = 0, fpsFrames = 0, fpsTimer = 0;
const fpsEl = document.getElementById('fps');
const chunkEl = document.getElementById('chunkinfo');

function resolveCollisions(pos, obstacles) {
  for (const o of obstacles) {
    const dx = pos.x - o.x;
    const dz = pos.z - o.z;
    const dist = Math.hypot(dx, dz);
    const minDist = o.r + PLAYER_RADIUS;
    if (dist < minDist && dist > 0.0001) {
      const push = (minDist - dist);
      pos.x += (dx / dist) * push;
      pos.z += (dz / dist) * push;
    }
  }
  // Sin límite de mundo: el terreno se extiende mientras haya chunks generados alrededor.
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05); // clamp para evitar saltos si hay lag

  // Entrada combinada: teclado + joystick
  let inputX = 0, inputZ = 0;
  if (keys.forward) inputZ -= 1;
  if (keys.back) inputZ += 1;
  if (keys.left) inputX -= 1;
  if (keys.right) inputX += 1;

  if (joyActive) {
    inputX += joyVector.x;
    inputZ += joyVector.y;
  }

  const inputLen = Math.hypot(inputX, inputZ);
  if (inputLen > 0.001) {
    inputX /= Math.max(inputLen, 1);
    inputZ /= Math.max(inputLen, 1);

    const move = new THREE.Vector3()
      .addScaledVector(isoForward, -inputZ)
      .addScaledVector(isoRight, inputX);

    if (move.lengthSq() > 0.0001) {
      move.normalize().multiplyScalar(PLAYER_SPEED * dt * Math.min(inputLen, 1));
      const nextPos = player.position.clone().add(move);
      resolveCollisions(nextPos, chunkManager.getAllObstacles());
      player.position.copy(nextPos);

      const targetAngle = Math.atan2(move.x, move.z);
      player.rotation.y = lerpAngle(player.rotation.y, targetAngle, 0.2);
    }
  }

  // Cargar/descargar chunks según posición del jugador
  const { pcx, pcz } = chunkManager.update(player.position.x, player.position.z);

  camera.position.copy(player.position).add(cameraOffset);
  camera.lookAt(player.position.x, player.position.y + 1, player.position.z);

  renderer.render(scene, camera);

  // FPS + info de chunk
  fpsFrames++;
  fpsTimer += dt;
  if (fpsTimer >= 0.5) {
    fpsEl.textContent = Math.round(fpsFrames / fpsTimer);
    fpsFrames = 0;
    fpsTimer = 0;
  }
  chunkEl.textContent = `${pcx},${pcz} (${chunkManager.loaded.size} activos)`;
}

function lerpAngle(a, b, t) {
  let diff = ((b - a + Math.PI) % (Math.PI * 2)) - Math.PI;
  if (diff < -Math.PI) diff += Math.PI * 2;
  return a + diff * t;
}

animate();
</script>
</body>
</html>
